<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Radar de Apostas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* =====================================================================
   RADAR DE APOSTAS (saída: painel.html). Gerado por `python rotina.py` a partir de dados/.
   Não edite a saída: edite este modelo (modelos/painel.html) e gere de novo.
   Todo número vem do JSON injetado no marcador de dados; este arquivo não carrega número.
   A pergunta que a tela responde em 5 segundos: onde estão as oportunidades ≥ régua de hoje
   e dos próximos dias. Por isso: Destaques no topo, um dia por vez, torneio agrupado.
   ===================================================================== */

/* ---------- tokens: tema claro ---------- */
:root{
  --bg:#f5f7fa; --bg-2:#eaeef4; --surface:#ffffff; --surface-2:#f0f3f7; --surface-3:#e4e9f0;
  --ink:#0f1720; --ink-2:#31404f; --muted:#5b6b7c; --muted-2:#8695a4;
  --line:#dfe5ec; --line-2:#c6d0da;
  --acc:#1657c4; --acc-suave:#e6eefb;
  --ok:#0f7a45; --ok-bg:#dcf2e6; --warn:#8a5b00; --warn-bg:#fbeecd; --crit:#b42318; --crit-bg:#fbe4e2;
  --selo:#121a23; --selo-ink:#f6c945; --selo-borda:#121a23;
  --esp-futebol:#1b8a5a; --esp-nba:#c2660f; --esp-nfl:#7a5a2e; --esp-tenis:#4f7f12; --esp-ufc:#b03a37;
  --sombra-1:0 1px 2px rgba(15,23,32,.06);
  --sombra-2:0 1px 2px rgba(15,23,32,.06),0 8px 20px -8px rgba(15,23,32,.18);
  --sombra-3:0 24px 70px -20px rgba(15,23,32,.45);
  --r-1:8px; --r-2:12px; --r-3:18px;
  --font-d:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --font-b:"Barlow","Helvetica Neue",Arial,sans-serif;
  --t:.16s cubic-bezier(.2,.7,.4,1);
}
/* ---------- tokens: tema escuro ---------- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#090d12; --bg-2:#0e141b; --surface:#131b24; --surface-2:#1a242f; --surface-3:#22303d;
    --ink:#e9eff5; --ink-2:#c3cfdb; --muted:#94a3b3; --muted-2:#6d7d8d;
    --line:#22303d; --line-2:#334556;
    --acc:#75a9ff; --acc-suave:#122135;
    --ok:#4fc98a; --ok-bg:#0f2e20; --warn:#e6b955; --warn-bg:#35290d; --crit:#f58b84; --crit-bg:#3a1a18;
    --selo:#f6c945; --selo-ink:#141000; --selo-borda:#f6c945;
    --esp-futebol:#52cc95; --esp-nba:#f0a058; --esp-nfl:#cfa56b; --esp-tenis:#a5d95a; --esp-ufc:#f4837e;
    --sombra-1:0 1px 2px rgba(0,0,0,.5);
    --sombra-2:0 1px 2px rgba(0,0,0,.5),0 10px 26px -10px rgba(0,0,0,.7);
    --sombra-3:0 30px 80px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#090d12; --bg-2:#0e141b; --surface:#131b24; --surface-2:#1a242f; --surface-3:#22303d;
  --ink:#e9eff5; --ink-2:#c3cfdb; --muted:#94a3b3; --muted-2:#6d7d8d;
  --line:#22303d; --line-2:#334556;
  --acc:#75a9ff; --acc-suave:#122135;
  --ok:#4fc98a; --ok-bg:#0f2e20; --warn:#e6b955; --warn-bg:#35290d; --crit:#f58b84; --crit-bg:#3a1a18;
  --selo:#f6c945; --selo-ink:#141000; --selo-borda:#f6c945;
  --esp-futebol:#52cc95; --esp-nba:#f0a058; --esp-nfl:#cfa56b; --esp-tenis:#a5d95a; --esp-ufc:#f4837e;
  --sombra-1:0 1px 2px rgba(0,0,0,.5);
  --sombra-2:0 1px 2px rgba(0,0,0,.5),0 10px 26px -10px rgba(0,0,0,.7);
  --sombra-3:0 30px 80px -20px rgba(0,0,0,.8);
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-family:var(--font-d);line-height:1.03;text-wrap:balance}
p{margin:0}
a{color:var(--acc)}
.wrap{max-width:1120px;margin:0 auto;padding:14px 16px 56px}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;scroll-behavior:auto !important}}

.ico{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.e-futebol{--esp:var(--esp-futebol)} .e-nba{--esp:var(--esp-nba)} .e-nfl{--esp:var(--esp-nfl)}
.e-tenis{--esp:var(--esp-tenis)} .e-ufc{--esp:var(--esp-ufc)} .e-outro{--esp:var(--muted)}

/* ---------- cabeçalho compacto ---------- */
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.marca .logo{width:38px;height:38px;flex:none;border-radius:11px;background:var(--selo);color:var(--selo-ink);
  display:grid;place-items:center;box-shadow:var(--sombra-1)}
.marca .logo svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.marca h1{font-size:26px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase}
.marca h1 em{font-style:normal;color:var(--muted)}
.meta{font-size:11.5px;color:var(--muted);letter-spacing:.02em;margin-top:1px;overflow-wrap:anywhere}
.btn-ic{width:38px;height:38px;border:1px solid var(--line-2);background:var(--surface);border-radius:11px;
  display:grid;place-items:center;transition:background var(--t),border-color var(--t)}
.btn-ic:hover{background:var(--surface-2);border-color:var(--muted-2)}
.btn-ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}

/* ---------- faixa fina de números ---------- */
.faixa{display:flex;flex-wrap:wrap;gap:0 22px;align-items:baseline;margin:12px 0 8px;padding:8px 12px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-2);box-shadow:var(--sombra-1)}
.faixa .f{display:flex;align-items:baseline;gap:6px;padding:1px 0}
.faixa b{font-family:var(--font-d);font-size:22px;font-weight:700;line-height:1}
.faixa span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.faixa .f.ouro b{color:var(--acc)}

/* ---------- aviso discreto ---------- */
.aviso{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.aviso>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;
  padding:3px 10px 3px 8px;border:1px dashed var(--line-2);border-radius:999px}
.aviso>summary::-webkit-details-marker{display:none}
.aviso>summary::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn);flex:none}
.aviso[open]>summary{border-style:solid}
.aviso p{margin-top:8px;padding:10px 12px;background:var(--warn-bg);color:var(--ink-2);
  border-left:3px solid var(--warn);border-radius:0 var(--r-1) var(--r-1) 0;font-size:13px}
.dlg .aviso{margin-top:14px}

/* ---------- abas ---------- */
nav.abas{display:flex;gap:2px;margin:14px 0 0;border-bottom:1px solid var(--line-2);overflow-x:auto;scrollbar-width:none}
nav.abas::-webkit-scrollbar{display:none}
nav.abas button{border:0;background:none;padding:9px 13px;font-family:var(--font-d);font-size:17px;font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;
  transition:color var(--t),border-color var(--t)}
nav.abas button:hover{color:var(--ink-2)}
nav.abas button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
nav.abas .badge{display:inline-block;margin-left:5px;min-width:19px;padding:0 5px;border-radius:999px;
  background:var(--acc-suave);color:var(--acc);font-family:var(--font-b);font-size:12px;font-weight:700;line-height:19px;text-align:center}
section.painel[hidden]{display:none}
section.painel{padding-top:14px}

/* ---------- destaques ---------- */
.dest-cab{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.dest-cab h2{font-size:21px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.dest-cab h2 .pt{width:9px;height:9px;border-radius:50%;background:#e8b21f;box-shadow:0 0 0 4px rgba(232,178,31,.2)}
.dest-cab p{font-size:13px;color:var(--muted)}
.destaques{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px;margin-bottom:24px}
.cd{position:relative;text-align:left;border:1px solid var(--line);border-left:3px solid var(--esp,var(--line-2));
  background:var(--surface);border-radius:var(--r-2);padding:11px 12px 12px;box-shadow:var(--sombra-1);
  display:grid;gap:7px;transition:transform var(--t),box-shadow var(--t),border-color var(--t)}
.cd:hover{transform:translateY(-2px);box-shadow:var(--sombra-2)}
.cd .cd-top{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--esp,var(--muted));font-weight:600}
.cd .cd-top .ico{font-size:14px}
.cd .cd-top .qd{margin-left:auto;color:var(--muted);letter-spacing:.02em}
.cd .cd-tit{font-weight:600;font-size:15px;line-height:1.25;overflow-wrap:anywhere;color:var(--ink)}
.cd .cd-pe{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:1px}
.cd .cd-p{font-family:var(--font-d);font-size:34px;font-weight:800;line-height:.9;color:var(--ink)}
.cd .cd-p small{display:block;font-family:var(--font-b);font-size:10.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);line-height:1.4;margin-top:3px}
.cd .cd-n{background:var(--selo);color:var(--selo-ink);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.vazio-dest{border:1px dashed var(--line-2);border-radius:var(--r-2);padding:16px;color:var(--muted);font-size:13.5px;margin-bottom:22px}

/* ---------- seletor de dias (fixo ao rolar) ---------- */
.dias-wrap{position:sticky;top:0;z-index:5;margin:0 -16px;padding:8px 16px 8px;
  background:linear-gradient(var(--bg) 72%,rgba(0,0,0,0));backdrop-filter:blur(6px)}
.dias{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.dias::-webkit-scrollbar{display:none}
.dias button{flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-2);
  padding:6px 11px 7px;text-align:left;min-width:96px;transition:background var(--t),border-color var(--t),color var(--t)}
.dias button:hover{border-color:var(--muted-2)}
.dias .d1{display:block;font-family:var(--font-d);font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.dias .d2{display:block;font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap}
.dias .d3{display:block;font-size:11px;font-weight:600;color:var(--ink-2);white-space:nowrap;margin-top:1px}
.dias .pip{display:inline-block;width:6px;height:6px;border-radius:50%;background:#e8b21f;margin-right:4px;vertical-align:1px}
.dias button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dias button[aria-selected="true"] .d2{color:var(--bg);opacity:.72}
.dias button[aria-selected="true"] .d3{color:var(--bg);opacity:.95}

/* ---------- filtros ---------- */
.filtros{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 4px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);background:var(--surface);
  border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;color:var(--ink-2);
  transition:background var(--t),border-color var(--t),color var(--t)}
.chip .ico{font-size:14px;color:var(--esp,var(--muted))}
.chip .qt{font-size:11.5px;color:var(--muted);font-weight:600}
.chip:hover{border-color:var(--muted-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .ico,.chip[aria-pressed="true"] .qt{color:var(--bg);opacity:.85}
.busca{position:relative;flex:1 1 170px;min-width:150px}
.busca input{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px 6px 30px;font-size:13px}
.busca svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;
  fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;pointer-events:none}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;border:1px solid var(--line-2);
  background:var(--surface);border-radius:999px;padding:4px 12px 4px 8px}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw .tr{width:34px;height:19px;border-radius:999px;background:var(--surface-3);position:relative;transition:background var(--t);flex:none}
.sw .tr::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--surface);
  box-shadow:var(--sombra-1);transition:transform var(--t)}
.sw input:checked+.tr{background:var(--acc)}
.sw input:checked+.tr::after{transform:translateX(15px)}
.sw input:focus-visible+.tr{outline:3px solid var(--acc);outline-offset:2px}
.sel-t{flex:1 1 150px;min-width:0;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:13px;max-width:100%}

/* ---------- grupos por torneio ---------- */
.grupo{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-2);margin:10px 0;
  overflow:hidden;box-shadow:var(--sombra-1)}
.grupo.tem{border-color:var(--line-2)}
.gcab{display:flex;align-items:center;gap:9px;width:100%;border:0;background:var(--surface-2);padding:9px 12px;text-align:left;
  border-left:3px solid var(--esp,var(--line-2));transition:background var(--t)}
.gcab:hover{background:var(--surface-3)}
.gcab .ico{font-size:17px;color:var(--esp,var(--muted))}
.gcab .gn{font-family:var(--font-d);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcab .gq{font-size:11.5px;color:var(--muted);white-space:nowrap}
.gcab .gop{margin-left:auto;background:var(--selo);color:var(--selo-ink);border-radius:999px;padding:1px 9px;
  font-size:12px;font-weight:700;white-space:nowrap}
.gcab .seta{margin-left:auto;width:15px;height:15px;flex:none;fill:none;stroke:var(--muted);stroke-width:2.2;
  stroke-linecap:round;transition:transform var(--t)}
.gcab .gop+.seta{margin-left:0}
.gcab[aria-expanded="false"] .seta{transform:rotate(-90deg)}
.gcab[aria-expanded="false"]+.glista{display:none}
.glista{display:block}

/* ---------- linha do evento ---------- */
.ev{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:11px;align-items:center;width:100%;text-align:left;
  border:0;border-top:1px solid var(--line);background:none;padding:9px 12px;color:var(--ink);transition:background var(--t)}
.ev:first-child{border-top:0}
.ev:hover{background:var(--surface-2)}
.ev .hora{font-family:var(--font-d);font-size:19px;font-weight:700;line-height:1.05}
.ev .hora small{display:block;font-family:var(--font-b);font-size:10px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted-2);margin-top:1px}
.ev .tit{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.ev .sub{font-size:12px;color:var(--muted);margin-top:1px}
.ev.zero .tit{font-weight:500;color:var(--ink-2)}
.ev.fim{opacity:.62}
.ev.fim:hover{opacity:1}
.mini{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--surface-3);margin-top:6px;max-width:240px}
.mini i{display:block;height:100%}
.mini i.c{background:var(--esp,var(--acc))} .mini i.x{background:var(--muted-2);opacity:.55} .mini i.f{background:var(--acc);opacity:.55}
.selo{display:inline-flex;align-items:baseline;gap:4px;border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px;
  background:var(--selo);color:var(--selo-ink);white-space:nowrap;box-shadow:var(--sombra-1)}
.selo small{font-size:10.5px;letter-spacing:.04em;font-weight:600;opacity:.85}
.selo.zero{background:none;color:var(--muted-2);border:0;font-size:11.5px;font-weight:500;padding:3px 2px;box-shadow:none}
.selo.fim{background:var(--surface-3);color:var(--ink-2);font-size:13px;box-shadow:none}
.vazio{color:var(--muted);padding:18px 12px;font-size:13.5px}
.semjanela{margin-top:16px;font-size:12.5px;color:var(--muted)}
.encerrados>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 12px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-2);font-size:13px;color:var(--muted)}
.encerrados>summary::-webkit-details-marker{display:none}
.encerrados{margin:14px 0 0}
.encerrados[open]>summary{border-radius:var(--r-2) var(--r-2) 0 0}
.encerrados .grupo{margin:0;border-radius:0 0 var(--r-2) var(--r-2);border-top:0}

/* ---------- barra 1-X-2 ---------- */
.b12{margin:2px 0 0}
.b12 .tr{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--surface-3)}
.b12 .tr i{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  min-width:0;overflow:hidden;white-space:nowrap}
.b12 .tr i{color:var(--bg)}
.b12 .tr i.c{background:var(--esp,var(--acc))} .b12 .tr i.x{background:var(--muted)} .b12 .tr i.f{background:var(--acc)}
.b12 .rot{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);margin-top:5px}
.b12 .rot span{max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b12 .rot span:last-child{text-align:right}
.forma{display:flex;gap:3px;flex-wrap:wrap}
.forma b{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.forma b{color:var(--bg)}
.forma b.V{background:var(--ok)} .forma b.E{background:var(--muted)} .forma b.D{background:var(--crit)}
.lado{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.lado .ln{font-weight:600;font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.lado .lf{margin-left:auto;flex:none}
.lado .lnota{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.dests{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:7px;margin-top:11px}
.dest{background:var(--surface-2);border-radius:var(--r-1);padding:7px 10px}
.dest span{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dest b{display:block;font-family:var(--font-d);font-size:19px;font-weight:700;line-height:1.15;margin-top:1px;overflow-wrap:anywhere}

/* ---------- oportunidade: cartão com medidor ---------- */
.op{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-2);padding:11px 12px;margin-top:9px;
  box-shadow:var(--sombra-1)}
.op .ot{font-size:17px;font-weight:700;line-height:1.25;overflow-wrap:anywhere;letter-spacing:-.005em}
.op .oM{display:flex;align-items:center;gap:13px;margin-top:9px}
.op .med{flex:1;min-width:0}
.op .med .esc{position:relative;height:10px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.op .med .esc i{position:absolute;top:0;bottom:0;left:0;border-radius:5px;background:linear-gradient(90deg,var(--acc),#e8b21f)}
.op .med .esc u{position:absolute;top:-2px;bottom:-2px;width:3px;margin-left:-1px;background:var(--ink);opacity:.8}
.op .med .leg{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:4px}
.op .opp{font-family:var(--font-d);font-size:33px;font-weight:800;line-height:.9;color:var(--ink);flex:none}
.op .lei{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.45}
.op details{margin-top:6px}
.op summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--acc);list-style:none;display:inline-flex;gap:5px;align-items:center}
.op summary::-webkit-details-marker{display:none}
.op summary::after{content:"›";transform:rotate(90deg);display:inline-block;font-weight:700}
.op details[open] summary::after{transform:rotate(-90deg)}
.op details p{font-size:12px;color:var(--muted);margin-top:5px;padding:8px 10px;background:var(--surface-2);border-radius:var(--r-1);line-height:1.5}

/* ---------- painel lateral / folha do evento ---------- */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--sombra-3);
  max-width:none;max-height:none;width:100%;height:auto}
dialog::backdrop{background:rgba(5,9,13,.6)}
@media (min-width:721px){
  dialog{margin:0 0 0 auto;height:100%;max-height:100%;width:min(690px,96vw);border-radius:var(--r-3) 0 0 var(--r-3);
    border-left:1px solid var(--line-2)}
}
@media (max-width:720px){
  dialog{margin:auto auto 0;height:94dvh;max-height:94dvh;width:100%;border-radius:var(--r-3) var(--r-3) 0 0}
}
.dlg{display:flex;flex-direction:column;height:100%}
.dlg .cab{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:flex-start;padding:14px 16px 11px;
  background:var(--surface);border-bottom:1px solid var(--line)}
.dlg .cab .k{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--esp,var(--muted));font-weight:600;margin-bottom:3px}
.dlg .cab .k .ico{font-size:14px}
.dlg h2{font-size:25px;font-weight:800;text-transform:uppercase;letter-spacing:-.005em;overflow-wrap:anywhere}
.dlg .quando{font-size:12.5px;color:var(--muted);margin-top:3px}
.dlg .corpo{padding:14px 16px 28px;overflow-y:auto;overscroll-behavior:contain;flex:1}
.dlg h4{margin:18px 0 6px;font-family:var(--font-d);font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.dlg h4:first-child{margin-top:0}
.dlg ul{margin:4px 0;padding-left:17px;font-size:13.5px;color:var(--ink-2)}
.dlg li{margin:4px 0}
.dlg .resumo{font-size:15px;line-height:1.5}
.x{width:34px;height:34px;flex:none;margin-left:auto;border:1px solid var(--line-2);background:var(--surface);
  border-radius:10px;display:grid;place-items:center;transition:background var(--t)}
.x:hover{background:var(--surface-2)}
.x svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.marca-fim{display:inline-block;background:var(--surface-3);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}

/* ---------- cartões / tabelas (desempenho e perguntas) ---------- */
.cartao{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-2);box-shadow:var(--sombra-1);padding:14px 15px;margin-bottom:14px}
.cartao h3{font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:7px}
.cartao p{margin:6px 0}
.nota{font-size:12.5px;color:var(--muted);line-height:1.5}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-2);box-shadow:var(--sombra-1);padding:12px 13px}
.kpi span{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-family:var(--font-d);font-size:38px;font-weight:800;line-height:1;margin:5px 0 3px}
.kpi small{display:block;font-size:11.5px;color:var(--muted);line-height:1.35}
.grafico{width:100%;max-width:560px;height:auto;display:block;margin:8px 0 4px;overflow:visible}
.grafico text{font-family:var(--font-b);font-size:11px;fill:var(--muted)}
.grafico text.nome{fill:var(--ink);font-weight:600}
.grafico text.val{fill:var(--ink);font-weight:700}
details.secao{border-top:1px solid var(--line);margin-top:10px}
details.secao>summary{cursor:pointer;list-style:none;padding:9px 0 8px;font-family:var(--font-d);font-size:15px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
details.secao>summary::-webkit-details-marker{display:none}
details.secao>summary::before{content:"›";display:inline-block;transform:rotate(90deg);transition:transform var(--t);font-size:17px}
details.secao[open]>summary::before{transform:rotate(-90deg)}
.tabela{width:100%;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:600}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)}
.barra{position:relative;height:8px;border-radius:4px;background:var(--surface-3);min-width:90px}
.barra i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--acc);opacity:.5}
.barra b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.barra u{position:absolute;top:-3px;bottom:-3px;width:0;border-left:2px dashed var(--crit)}
.perg{border-top:1px solid var(--line);padding:11px 0}
.perg:first-of-type{border-top:0}
.perg .q{font-weight:600}
.eyebrow{font-family:var(--font-d);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:11.5px;color:var(--muted)}
.nada{display:flex;gap:12px;align-items:center;padding:20px 16px;border:1px dashed var(--line-2);border-radius:var(--r-2);color:var(--muted)}
.nada svg{width:26px;height:26px;flex:none;fill:none;stroke:var(--ok);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nada b{display:block;color:var(--ink);font-family:var(--font-d);font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.rodape{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted-2)}

@media (max-width:720px){
  .wrap{padding:12px 16px 48px}
  .marca h1{font-size:22px}
  .faixa{gap:0 16px;padding:7px 11px}
  .faixa b{font-size:19px}
  .faixa{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px}
  .destaques{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -16px 20px;
    padding:2px 16px 10px;scrollbar-width:none}
  .destaques::-webkit-scrollbar{display:none}
  .cd{flex:0 0 78%;scroll-snap-align:start}
  .ev{grid-template-columns:48px minmax(0,1fr) auto;gap:9px;padding:9px 10px}
  .col-opc{display:none}
  .kpi b{font-size:32px}
}

    h += '<div class="cartao"><h3>Ao vivo: o que o painel publicou</h3>';
    if (!L.geral.n) {
      h += '<div class="nada"><svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.01"/><circle cx="12" cy="12" r="9"/></svg>' +
        "<div><b>Nada encerrado ainda</b>As previsões publicadas hoje só entram nesta conta depois que o evento acaba. Enquanto isso, o número que existe é o do backtest, abaixo.</div></div>";
    } else {
      h += "<p>" + geral(L.geral) + "</p>" + (L.por_esporte.length ? "<h4 class=\"eyebrow\" style=\"margin:14px 0 0\">Acerto por esporte contra a régua</h4>" + grafico(L.por_esporte, "acerto ao vivo por esporte contra a régua") : "") +
        tabela("Por esporte", L.por_esporte) + tabela("Por mercado", L.por_mercado) + tabela("Por torneio", L.por_torneio) + tabela("Por faixa de probabilidade", L.por_faixa);
      if (L.ultimas.length) {
        h += '<details class="secao"><summary>Últimas encerradas</summary><ul>';
        L.ultimas.forEach(function(u){
          var c = u.estado === "bateu" ? "ok" : (u.estado === "nao_bateu" ? "crit" : "warn"), rot = u.estado === "bateu" ? "bateu" : (u.estado === "nao_bateu" ? "não bateu" : "anulada");
          h += '<li><span class="pill ' + c + '">' + rot + "</span> " + esc(u.titulo) + " — " + esc(u.texto) + " (" + pct(u.p) + ") · " + esc(u.placar || "") + "</li>";
        });
        h += "</ul></details>";
      }
    }
    h += '<p class="nota" style="margin-top:12px">' + L.publicadas + " previsões publicadas · " + L.abertas + " aguardando o evento · " + L.anuladas + " anuladas.</p></div>";

    h += '<div class="cartao"><h3>Antes da estreia: backtest</h3><p>Validação fora da amostra, de ' + esc(B.periodo.corte_da_validacao) + " a " + esc(B.periodo.fim) +
      " (" + B.jogos.na_validacao + " jogos previstos só com o que havia antes de cada um): " + geral(B.geral) + ". " + B.eventos_com_oportunidade + " eventos teriam tido oportunidade.</p>" +
      (B.por_esporte.length ? grafico(B.por_esporte, "acerto do backtest por esporte contra a régua") : "") +
      tabela("Por esporte", B.por_esporte) + tabela("Por faixa de probabilidade", B.por_faixa) + tabela("Por mercado", B.por_mercado) + tabela("Por torneio", B.por_torneio) +
      '<p class="nota" style="margin-top:12px">Backtest não é promessa: mede o algoritmo v' + esc(B.versao) + " em jogos passados. O número que vale é o do quadro “Ao vivo”, que cresce a cada dia.</p></div>";

    h += '<div class="cartao"><h3>Como o robô muda</h3>' +
      "<p>" + (um ? "Última mudança: <b>" + esc(um.data) + " · v" + esc(um.versao) + "</b> — " + esc(um.texto) : "Sem mudança registrada.") + "</p>" +
      (D.rebaixados.length ? '<p><span class="pill crit">Mercados rebaixados</span> ' + esc(D.rebaixados.join(" · ")) + "</p>" : "") +
      '<p class="nota">O robô só muda com amostra: mínimo de ' + D.amostra_minima + " previsões encerradas por mercado. Toda mudança sobe a versão e ganha linha datada no histórico do algoritmo. A régua de " + pct(D.regua, 0) + " só muda por decisão de Gustavo.</p></div>";
    $("aba-desempenho").innerHTML = h;
  })();

  // ---------- perguntas ----------
  (function(){
    var h = "";
    if (D.perguntas.length) {
      h += '<div class="cartao"><h3>Perguntas abertas a Gustavo</h3>';
      D.perguntas.forEach(function(p){
        h += '<div class="perg"><div class="eyebrow">' + esc(p.id) + " · " + esc(p.tema) + " · aberta em " + esc(p.aberta_em) + '</div><div class="q">' + esc(p.pergunta) +
          "</div><p><b>Recomendação:</b> " + esc(p.recomendacao) + '</p><p class="nota"><b>Por quê:</b> ' + esc(p.porque) + "</p></div>";
      });
      h += '<p class="nota">Para responder, fale com o Muricy no chat citando o código da pergunta.</p></div>';
    } else {
      h += '<div class="cartao"><div class="nada"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>' +
        "<div><b>Nenhuma pergunta aberta</b>O robô só pergunta quando a dúvida é de critério esportivo e muda o que entra no painel. Quando houver uma, ela aparece aqui com a recomendação e o porquê — e o número da aba avisa.</div></div>";
      if (D.respondidas && D.respondidas.length) {
        h += '<details class="secao" style="border-top:0"><summary>Histórico: ' + D.respondidas.length + " respondida" + (D.respondidas.length > 1 ? "s" : "") + "</summary>";
        D.respondidas.forEach(function(p){
          h += '<div class="perg"><div class="eyebrow">' + esc(p.id) + " · " + esc(p.tema) + (p.respondida_em ? " · respondida em " + esc(p.respondida_em) : "") +
            '</div><div class="q">' + esc(p.pergunta) + '</div><p><b>Gustavo:</b> ' + esc(p.resposta) + "</p></div>";
        });
        h += "</details>";
      }
      h += "</div>";
    }
    if (D.perguntas.length && D.respondidas && D.respondidas.length) {
      h += '<div class="cartao"><details class="secao" style="border-top:0"><summary>Histórico: ' + D.respondidas.length + " respondida" + (D.respondidas.length > 1 ? "s" : "") + "</summary>";
      D.respondidas.forEach(function(p){
        h += '<div class="perg"><div class="eyebrow">' + esc(p.id) + " · " + esc(p.tema) + (p.respondida_em ? " · respondida em " + esc(p.respondida_em) : "") +
          '</div><div class="q">' + esc(p.pergunta) + '</div><p><b>Gustavo:</b> ' + esc(p.resposta) + "</p></div>";
      });
      h += "</details></div>";
    }
    $("aba-perguntas").innerHTML = h;
  })();

  desenhaFiltros();
  desenhaDias();
  desenhaLista();
})();
</script>
</body>
</html>
